{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="card">
    <h1>Add Student</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save Student</button>
        <a class="btn" href="/">Cancel</a>
    </form>
</div>
{% endblock %}
