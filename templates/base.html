<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        nav { background: #222; color: white; padding: 16px 24px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px #ddd; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        .btn { display: inline-block; padding: 10px 15px; background: #222; color: white; text-decoration: none; border-radius: 6px; border: 0; cursor: pointer; }
        .danger { background: #b42318; }
        input { width: 100%; padding: 10px; box-sizing: border-box; margin: 6px 0 14px; }
        label { font-weight: bold; }
    </style>
</head>
<body>
<nav><a href="/">Student Management System</a></nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
